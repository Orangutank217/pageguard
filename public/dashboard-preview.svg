<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <clipPath id="graph-clip">
      <rect x="580" y="145" width="180" height="60" rx="4" />
    </clipPath>
  </defs>

  <!-- Browser chrome -->
  <rect x="40" y="20" width="720" height="460" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)" />
  <rect x="40" y="20" width="720" height="44" rx="12" fill="#f8fafc" />
  <rect x="40" y="52" width="720" height="12" fill="#f8fafc" />
  <rect x="40" y="20" width="720" height="44" rx="12" fill="url(#bg-grad)" />

  <!-- Window dots -->
  <circle cx="64" cy="42" r="6" fill="#ef4444" />
  <circle cx="84" cy="42" r="6" fill="#f59e0b" />
  <circle cx="104" cy="42" r="6" fill="#22c55e" />

  <!-- URL bar -->
  <rect x="160" y="32" width="340" height="20" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1" />
  <text x="180" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">https://pguard.co/dashboard</text>

  <!-- === Dashboard content area === -->

  <!-- Sidebar -->
  <rect x="60" y="80" width="160" height="380" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

  <!-- Sidebar logo -->
  <text x="80" y="110" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">PageGuard</text>
  <rect x="80" y="116" width="20" height="2" rx="1" fill="#3b82f6" />

  <!-- Sidebar nav items -->
  <rect x="72" y="140" width="136" height="32" rx="6" fill="#3b82f6" />
  <text x="86" y="160" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">Monitors</text>

  <text x="86" y="196" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Status Pages</text>
  <text x="86" y="224" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Settings</text>

  <!-- Main content area -->
  <text x="250" y="110" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Monitors</text>

  <!-- Add monitor button -->
  <rect x="610" y="92" width="130" height="28" rx="6" fill="#3b82f6" />
  <text x="628" y="111" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">+ Add Monitor</text>

  <!-- Monitor list header -->
  <rect x="250" y="130" width="490" height="28" rx="6" fill="#f8fafc" />
  <text x="270" y="148" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">URL</text>
  <text x="420" y="148" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Status</text>
  <text x="490" y="148" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Uptime</text>
  <text x="560" y="148" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Response</text>
  <text x="640" y="148" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Last Check</text>

  <!-- Monitor row 1 -->
  <rect x="250" y="162" width="490" height="40" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1" />
  <text x="270" y="187" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a">pguard.co</text>
  <circle cx="430" cy="183" r="5" fill="#22c55e" />
  <text x="442" y="187" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e">Operational</text>
  <text x="510" y="187" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">100%</text>
  <text x="575" y="187" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">43ms</text>
  <text x="640" y="187" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">2 min ago</text>

  <!-- Monitor row 2 -->
  <rect x="250" y="206" width="490" height="40" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1" />
  <text x="270" y="231" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a">api.example.com</text>
  <circle cx="430" cy="227" r="5" fill="#22c55e" />
  <text x="442" y="231" font-family="system-ui, sans-serif" font-size="12" fill="#22c55e">Operational</text>
  <text x="510" y="231" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">99.9%</text>
  <text x="575" y="231" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">128ms</text>
  <text x="640" y="231" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">5 min ago</text>

  <!-- Monitor row 3 -->
  <rect x="250" y="250" width="490" height="40" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1" />
  <text x="270" y="275" font-family="system-ui, sans-serif" font-size="13" fill="#0f172a">blog.example.com</text>
  <circle cx="430" cy="271" r="5" fill="#f59e0b" />
  <text x="442" y="275" font-family="system-ui, sans-serif" font-size="12" fill="#f59e0b">Degraded</text>
  <text x="510" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">98.5%</text>
  <text x="575" y="275" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">320ms</text>
  <text x="640" y="275" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">1 min ago</text>

  <!-- Response time chart area -->
  <text x="250" y="320" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Response Time (last 24h)</text>

  <!-- Chart bars -->
  <rect x="270" y="355" width="14" height="30" rx="3" fill="url(#bar1)" />
  <rect x="292" y="340" width="14" height="45" rx="3" fill="url(#bar2)" />
  <rect x="314" y="360" width="14" height="25" rx="3" fill="url(#bar1)" />
  <rect x="336" y="335" width="14" height="50" rx="3" fill="url(#bar2)" />
  <rect x="358" y="350" width="14" height="35" rx="3" fill="url(#bar1)" />
  <rect x="380" y="330" width="14" height="55" rx="3" fill="url(#bar2)" />
  <rect x="402" y="355" width="14" height="30" rx="3" fill="url(#bar1)" />
  <rect x="424" y="345" width="14" height="40" rx="3" fill="url(#bar2)" />
  <rect x="446" y="360" width="14" height="25" rx="3" fill="url(#bar3)" />
  <rect x="468" y="338" width="14" height="47" rx="3" fill="url(#bar2)" />
  <rect x="490" y="350" width="14" height="35" rx="3" fill="url(#bar2)" />
  <rect x="512" y="342" width="14" height="43" rx="3" fill="url(#bar1)" />

  <!-- Chart x-axis labels -->
  <text x="270" y="400" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">00:00</text>
  <text x="370" y="400" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">06:00</text>
  <text x="490" y="400" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">12:00</text>

  <!-- Status summary cards row -->
  <!-- Card 1: Total Checks -->
  <rect x="250" y="420" width="155" height="42" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1" />
  <text x="266" y="436" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Total Checks (24h)</text>
  <text x="266" y="453" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">14,382</text>

  <!-- Card 2: Avg Response -->
  <rect x="417" width="155" height="42" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1" x2="572" y2="462" />
  <text x="433" y="436" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Avg Response</text>
  <text x="433" y="453" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">164 ms</text>

  <!-- Card 3: Incidents -->
  <rect x="585" y="420" width="155" height="42" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1" />
  <text x="601" y="436" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Incidents Today</text>
  <text x="601" y="453" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#22c55e">0</text>
</svg>
